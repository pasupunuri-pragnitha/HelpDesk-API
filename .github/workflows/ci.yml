name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Run Pytest & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  migrations-mysql:
    name: Test MySQL Migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: helpdesk_test_db
          MYSQL_USER: helpdesk_test_user
          MYSQL_PASSWORD: helpdesk_test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost --silent" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic migrations (upgrade -> downgrade -> upgrade)
        env:
          DATABASE_URL: mysql+pymysql://helpdesk_test_user:helpdesk_test_password@127.0.0.1:3306/helpdesk_test_db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run MySQL integration tests
        env:
          TEST_MYSQL_URL: mysql+pymysql://helpdesk_test_user:helpdesk_test_password@127.0.0.1:3306/helpdesk_test_db
        run: |
          pytest -m mysql
